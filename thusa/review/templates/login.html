{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow">
<h1>Sign in</h1>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Username <input name="username" required maxlength="32" autocapitalize="none" autocomplete="username"></label>
  <label>Password <input name="password" type="password" required maxlength="256" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<p class="muted">Accounts are created by an admin with <code>pf reviewer add</code>. There is no self sign-up.</p>
</section>
{% endblock %}
