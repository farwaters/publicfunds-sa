# Red-flag detector configuration. Changing thresholds = NORMAL change, risk tier HIGH (2 approvals).
# Design: docs/design/application-design.md §6.7. v0.1.0 MVP set re-scoped under CHG-2026-002 (see ADR-0007):
#   D1 is now "overspend vs budget" (fuel unit-price moved to D13: needs PPD/LOGIS data, manual drop pending);
#   D5 is now "award-value gaps" (non-competitive share moved to D14: procurement-method data too sparse);
#   D8 is now "irregular-expenditure trend" (other distress rules moved to D15: need aged-creditor/cash cubes).
# All flags are automated indicators. Flags naming a supplier/person are 'pending human review' (ADR-0005).
detectors:
  D1_overspend_vs_budget:
    version: 0.1.0
    mvp: true
    inputs: [curated.muni_fin_line (AUDA vs ADJB, fallback ORGB, item 4400), curated.nat_budget_line (Audit Outcome vs Final Appropriation)]
    rule: "audited > budget * (1 + threshold)"
    threshold: 0.20            # municipalities: operating expenditure EXCLUDING non-cash items below
    non_cash_items: ["3000", "3500", "3600", "4000", "4200", "4300"]  # loss on disposal, debt impairment, depreciation, write-offs, disposals, other losses
    national_threshold: 0.0    # national votes: any overspend of the final appropriation
    min_budget_rand: 10000000  # ignore budgets below R10m (noise)
    suspect_data_error_ratio: 2.0  # >200% over budget: reported as 'info' / possible source data error, not overspend
    severity: {med: 0.20, high: 0.50}
    publish_requires_review: true
  D3_restricted_supplier_awarded:
    version: 0.1.0
    mvp: true
    rule: "award date within [period_from, period_to] of a Restricted Supplier / Tender Defaulter entry"
    match: "exact normalised name (companies, >=2 tokens: 0.92; 1 token: 0.60) or sorted-token person name (0.90)"
    min_match_confidence: 0.90
    severity: {high: true}
    publish_requires_review: true
  D4_supplier_concentration:
    version: 0.1.0
    mvp: true
    window_years: 3
    hhi_threshold: 2500
    top_share_threshold: 0.50
    min_awards: 10
    min_total_rand: 10000000
    severity: {low: true}
    publish_requires_review: true
  D5_award_value_gaps:
    version: 0.1.0
    mvp: true
    rule: "share of a buyer's awards with no value, a 0 placeholder, or < R100 >= gap_share_threshold"
    min_awards: 20
    gap_share_threshold: 0.50
    severity: {info: true}
  D8_irregular_expenditure_trend:
    version: 0.1.0
    mvp: true
    rule: "reported irregular expenditure rises two years running and grows >= growth_yoy vs the previous year (all known)"
    fye_min: 2020               # coverage window; earlier years are not assessed
    growth_yoy: 0.5
    min_prev_rand: 1000000      # ignore growth from a base below R1m
    require_two_year_rise: true
    min_amount_rand: 10000000
    high_growth_yoy: 1.0
    high_min_amount_rand: 100000000
    severity: {med: true, high: "growth >= high_growth_yoy and amount >= high_min_amount_rand"}
  # CHG-2026-010: supplier-naming award-pattern detectors. Hidden leads only: four-eyes review, never published
  # (config/publication.yaml never_publish). Award dates are mostly the OCDS release date (a proxy), so time windows
  # are approximate. Buyers not linked to a government body (no known regime) are not assessed by D6/D17.
  D16_repeat_awards:
    version: 0.1.0
    mvp: true
    rule: "same buyer and supplier, single-supplier awards with a known value, >= min_awards within window_days"
    min_awards: 5
    window_days: 365
    severity: {low: true}
    publish_requires_review: true
    never_publish: true
  D17_just_below_threshold:
    version: 0.1.0
    mvp: true
    rule: "same buyer and supplier, >= min_count awards with value in [threshold * (1 - band), threshold] within window_days"
    band: 0.10
    min_count: 2
    window_days: 365
    severity: {low: true, med: "count >= 3"}
    publish_requires_review: true
    never_publish: true
  D6_threshold_splitting:
    version: 0.1.0
    mvp: true
    rule: "same buyer and supplier, >= 2 awards each <= threshold starting within window_days, summing to > threshold"
    window_days: 30
    severity: {med: true}
    caveat: "uses published awards, not orders; splitting can only be suspected, not shown"
    publish_requires_review: true
    never_publish: true
  D2_unit_price_outlier:   {version: 0.0.0, mvp: false, robust_z: 3.5}
  D7_triangulation:        {version: 0.0.0, mvp: false}
  D9_related_party:        {version: 0.0.0, mvp: false, publish_requires_review: true, legal_review: required}
  D10_capacity:            {version: 0.0.0, mvp: false, new_company_months: 12, value_threshold_rand: 10000000}
  D11_contract_expansion:  {version: 0.0.0, mvp: false, blocked_by: "deviation registers restricted"}
  D12_consequence_gap:     {version: 0.0.0, mvp: false}
  D13_fuel_unit_price:      # CHG-2026-009: PPD manual drop (RB-06) vs DMPR fuel price history (curated.fuel_price)
    version: 0.1.0
    mvp: true
    rule: "PPD line amount / quantity (unit = litres) > highest official DMPR price for that fuel type in the period * (1 + threshold)"
    threshold: 0.20             # diesel/paraffin benchmarks are wholesale list prices; pump prices sit a little above
    high_ratio: 2.0             # >= 2x the official price
    min_benchmark_months: 6     # a financial-year line needs >= 6 months of official prices in that year
    severity: {med: "ratio > 1 + threshold", high: "ratio >= high_ratio"}
    publish_requires_review: true
    never_publish: true         # see config/publication.yaml flags.never_publish
  D14_noncompetitive_share: {version: 0.0.0, mvp: false, peer_percentile: 0.90}
  D15_municipal_distress:  {version: 0.0.0, mvp: false, creditors_over_90_days_share: 0.5, cash_coverage_months_below: 1}
# Competitive-bidding thresholds (VAT/tax included). An award ABOVE the value needs a competitive bid; up to and
# including it, written price quotations are allowed. Only applied to awards dated on or after `from`.
procurement_thresholds:
  mfma:   # Municipal SCM Regulations reg 12(1)(c)-(d) and reg 19(b) (no deliberate splitting), as amended by
          # GN 4198, Government Gazette 49863, 14 Dec 2023, in effect on publication (reg 8 of the amendment):
          # https://mfma.treasury.gov.za/RegulationsandGazettes/Municipal%20SCM%20Amendment%20Regulations.pdf
    from: 2023-12-14
    rand: {metro: 750000, local: 300000, district: 200000}
  pfma:   # PFMA SCM Instruction No. 02 of 2021/22 para 3.2-3.3 and 4.1 (no deliberate splitting), effective
          # 1 Aug 2021 per its amendment:
          # https://ocpo.treasury.gov.za/Legislation/Instruction%20Notes/PFM%20SCM%20Instruction%20No.%2002%20of%202021-22%20Procurement%20thresholds%20and%20processes.pdf
          # https://ocpo.treasury.gov.za/Legislation/Instruction%20Notes/Amendment%20to%20PFMA%20SCM%20Instruction%20No.%2002%20of%202021-2022%20-%20Procurement%20Thresholds%20and%20processes.pdf
    from: 2021-08-01
    rand: {department: 1000000}
