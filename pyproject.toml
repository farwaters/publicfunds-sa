[project]
name = "thusa"
version = "0.1.0"
description = "Thusa MVP: South African public-spending data pipeline, coverage model and red-flag detectors"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb==1.4.1",
  "httpx==0.28.1",
  "pdfplumber==0.11.7",
  "pyyaml==6.0.3",
  "jinja2==3.1.6",
  "matplotlib==3.10.7",
  "pytz==2025.2",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
thusa = "thusa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thusa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end smoke test against the built warehouse"]
